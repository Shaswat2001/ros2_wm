# ═══════════════════════════════════════════════════════════════
# wm_runtime configuration
# ═══════════════════════════════════════════════════════════════
# One file to configure all nodes. Launch with:
#   ros2 launch wm_runtime imagination.launch.py
#
# Override any param at launch time:
#   ros2 launch wm_runtime imagination.launch.py \
#       device:=cuda:0 repo_id:=SaiResearch/sai_wm

# ── Model Server ──────────────────────────────────────────────
# Single owner of the world model. All other nodes talk to it
# via services. No other node loads a model copy.
wm_model_server:
  ros__parameters:
    # HuggingFace model to load on startup (empty = wait for /wm/load_model)
    repo_id: "SaiResearch/sai_wm"
    subfolder: "iris/atari/alien"
    device: "cpu"
    trust_remote_code: false

    # Status heartbeat rate (Hz). Set 0 to disable.
    status_rate_hz: 1.0

# ── Belief Publisher ──────────────────────────────────────────
# Thin sensor bridge. Does NOT load its own model — it calls the
# model_server's /wm/forward_observation service instead.
wm_belief_publisher:
  ros__parameters:
    # Observation mode: "dataset" | "image" | "vector"
    #   dataset — model_server samples from its linked AutoDataset
    #   image   — subscribes to image_topic, sends pixels to model_server
    #   vector  — subscribes to vector_topic, sends vectors to model_server
    obs_mode: "dataset"

    # Sensor topics (used when obs_mode is "image" or "vector")
    image_topic: "/camera/image_raw"
    vector_topic: "/obs_vector"
    joint_state_topic: "/joint_states"

    # How fast to send observations to model_server (Hz)
    publish_rate_hz: 10.0

    # Dataset mode settings
    dataset_seed: 42
    dataset_advance: true    # increment seed each tick for variety

    # Action sampling for the predict loop (used when continuous_predict is true)
    # These should match the loaded model's action space.
    # For Atari (IRIS): discrete with 18 actions.
    default_action_space: "discrete"
    default_num_actions: 18

    # If true, continuously call predict() with random actions after
    # forward() — streams imagined frames to /wm/viz/forward_frames.
    # If false (default), only forward() once to initialize the belief
    # state, then sit idle. Service calls (plan_action, step_action)
    # are faster when this is off because no background predict loop
    # competes for the model lock.
    continuous_predict: false

# ── Rollout Visualizer ────────────────────────────────────────
wm_rollout_visualizer:
  ros__parameters:
    # RViz frame for all markers
    frame_id: "wm_latent_space"

    # Spatial scale: multiplied with latent values to get RViz coordinates.
    # Increase for models with small latent values, decrease for large.
    scale: 0.1

    # Line widths (meters in RViz)
    line_width: 0.005
    best_line_width: 0.012
    sphere_size: 0.015

    # Which latent dimensions map to X, Y, Z
    # Change these to explore different latent subspaces
    latent_dims: [0, 1, 2]

    # Display toggles
    show_all_candidates: true
    show_uncertainty: true
    show_frames: true

    # Cap on how many candidate trajectories to render (for performance)
    max_display_candidates: 64